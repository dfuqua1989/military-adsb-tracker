<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Military ADS-B Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { background: #0f172a; color: #e2e8f0; }
    #map { height: 60vh; background: #1e293b; }
    .mil { background: #7f1d1d !important; }
  </style>
</head>
<body class="p-4">
  <div class="max-w-7xl mx-auto">
    <header class="flex flex-wrap justify-between items-center mb-4 gap-2">
      <h1 class="text-2xl font-bold text-red-400">Military Aircraft Tracker (ADS-B)</h1>
      <div class="flex gap-2 items-center">
        <span id="lastUpdate" class="text-sm text-slate-400">—</span>
        <button onclick="fetchData()" class="bg-red-700 hover:bg-red-600 px-3 py-1 rounded text-sm">Refresh</button>
      </div>
    </header>

    <p class="text-xs text-slate-500 mb-2">
      Live military aircraft via ADSB.lol /v2/mil (CORS proxy). Many military aircraft disable ADS-B.
      Navy vessels = AIS only. Reload if empty.
    </p>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <div class="lg:col-span-2">
        <div id="map" class="rounded-lg border border-slate-700"></div>
      </div>
      <div class="bg-slate-800 rounded-lg p-3 overflow-auto max-h-[60vh]">
        <h2 class="font-semibold mb-2">Aircraft (<span id="count">0</span>)</h2>
        <table class="w-full text-xs">
          <thead><tr class="text-left text-slate-400"><th>Callsign</th><th>ICAO</th><th>Alt</th><th>Spd</th></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const map = L.map('map').setView([39.8, -98.5], 4);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap, &copy; CARTO'
    }).addTo(map);
    let markers = L.layerGroup().addTo(map);
    let aircraft = [];

    async function fetchData() {
      try {
        // Military aircraft from ADSB.lol via CORS proxy
        const url = 'https://corsproxy.io/?' + encodeURIComponent('https://api.adsb.lol/v2/mil');
        const res = await fetch(url);
        if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
        const data = await res.json();
        aircraft = (data.ac || []).map(a => ({
          icao24: a.hex || '',
          callsign: (a.flight || '').trim(),
          lat: a.lat,
          lon: a.lon,
          alt: a.alt_baro || a.alt_geom || null,
          velocity: a.gs || null,
          heading: a.track || null
        })).filter(a => a.lat != null && a.lon != null);
        document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString() + ` (${aircraft.length})`;
        render();
      } catch (e) {
        document.getElementById('lastUpdate').textContent = 'Error: ' + e.message;
        console.error(e);
      }
    }

    function render() {
      const list = aircraft;
      document.getElementById('count').textContent = list.length;

      markers.clearLayers();
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      const bounds = [];
      list.forEach(a => {
        const color = '#ef4444';
        const marker = L.circleMarker([a.lat, a.lon], {
          radius: 6,
          color: color,
          fillColor: color,
          fillOpacity: 0.85
        }).bindPopup(`${a.callsign || 'N/A'}<br>ICAO: ${a.icao24}<br>Alt: ${a.alt != null ? Math.round(a.alt) + ' ft' : '—'}<br>Spd: ${a.velocity != null ? Math.round(a.velocity) + ' kt' : '—'}`);
        markers.addLayer(marker);
        bounds.push([a.lat, a.lon]);

        const tr = document.createElement('tr');
        tr.className = 'mil';
        tr.innerHTML = `<td>${a.callsign || '—'}</td><td>${a.icao24}</td><td>${a.alt != null ? Math.round(a.alt) : '—'}</td><td>${a.velocity != null ? Math.round(a.velocity) : '—'}</td>`;
        tbody.appendChild(tr);
      });
      if (bounds.length > 0) map.fitBounds(bounds, {padding: [30, 30], maxZoom: 6});
    }

    fetchData();
    setInterval(fetchData, 30000);
  </script>
</body>
</html>
